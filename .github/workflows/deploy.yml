name: Deploy Namo Monitoring to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Diagnose deployed Render API
        continue-on-error: true
        run: |
          echo "=== API health endpoint ==="
          curl --max-time 25 -sS -i https://namo-monitoring.onrender.com/api/health || true
          echo
          echo "=== Browser CORS preflight ==="
          curl --max-time 25 -sS -i -X OPTIONS https://namo-monitoring.onrender.com/api/auth/login \
            -H 'Origin: https://mohitprajapati1093-eng.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' || true

      - name: Build frontend
        run: npm run build -- --base=/Namo_monitoring/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
